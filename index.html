<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TENKA LAB</title>
<meta name="description" content="TENKA LAB の社内ダッシュボード">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TENKA LAB">
<style>
  :root {
    --bg: #F5F5F7; --card: #FFFFFF; --fill: #F5F5F7; --line: #E5E5EA;
    --text: #1D1D1F; --text-2: #6E6E73;
    --accent: #0071E3; --link: #0071E3; --on-accent: #FFFFFF; --btn-2: #E8E8ED;
    --bar: rgba(245,245,247,0.72);
    --red-t: #D70015; --red-b: #FFEBEE;
    --org-t: #C93400; --org-b: #FFF4E5;
    --gry-t: #6E6E73; --gry-b: #E8E8ED;
    --pur-t: #8944AB; --pur-b: #F5EEF8;
    --grn-t: #248A3D; --grn-b: #E8F5EC;
    --cl-t: #A0522D; --cl-b: #FBF1EA;
    --gp-t: #0E7C86; --gp-b: #E6F4F5;
    --dot: #34C759; --dot-off: #AEAEB2;
    --ring: rgba(0,0,0,0.06);
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06);
    --card-border: none;
    --seg-shadow: 0 1px 3px rgba(0,0,0,.12);
    --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    --pad: 24px; --gap: 24px; --sep: 24px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E; --line: #38383A;
      --text: #F5F5F7; --text-2: #A1A1A6;
      --link: #2997FF; --btn-2: #3A3A3C;
      --bar: rgba(0,0,0,0.72);
      --red-t: #FF6961; --red-b: #3A1D1F;
      --org-t: #FF9F0A; --org-b: #3A2A12;
      --gry-t: #A1A1A6; --gry-b: #2C2C2E;
      --pur-t: #BF5AF2; --pur-b: #2E1F36;
      --grn-t: #30D158; --grn-b: #17301F;
      --cl-t: #F0A07A; --cl-b: #3A2A22;
      --gp-t: #5AC8D0; --gp-b: #17302F;
      --ring: rgba(255,255,255,0.08);
      --shadow: none;
      --card-border: 1px solid var(--line);
      --seg-shadow: 0 1px 3px rgba(0,0,0,.5);
    }
  }
  @media (max-width: 767px) { :root { --pad: 16px; --gap: 16px; --sep: 16px; } }

  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
    font-size: 15px; line-height: 1.6; letter-spacing: 0; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, p { margin: 0; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 3px solid rgba(0,113,227,0.4); outline-offset: 2px; }
  .num, time, .tnum { font-variant-numeric: tabular-nums; }
  .sub { font-size: 13px; color: var(--text-2); line-height: 1.5; }
  .clamp1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .clamp2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ヘッダー */
  .hdr { position: sticky; top: 0; z-index: 20; background: var(--bar);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  .hdr-in { max-width: 1200px; margin: 0 auto; height: 52px; padding: 0 40px; display: flex; align-items: center; gap: 24px; }
  .hdr h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
  .hnav { display: flex; gap: 16px; }
  .hnav a { font-size: 13px; color: var(--text-2); }
  .hnav a.on { color: var(--text); }
  .hnav a:hover { text-decoration: none; color: var(--text); }
  .hsp { flex: 1; }
  .htime { font-size: 13px; color: var(--text-2); white-space: nowrap; }
  .cnav { display: none; }
  @media (max-width: 767px) {
    .hdr-in { padding: 0 16px; gap: 8px; }
    .hdr-in h1 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; }
    .htime { font-size: 12px; }
    .hdr-in .btn { flex: none; padding-left: 10px; padding-right: 10px; }
    .hnav { display: none; }
    .cnav { display: flex; gap: 8px; height: 44px; align-items: center; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
    .cnav::-webkit-scrollbar { display: none; }
    .cnav a { flex: none; height: 32px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 999px; background: var(--fill); color: var(--text); font-size: 13px; font-weight: 700; }
    .cnav a.on { background: var(--text); color: var(--card); }
    .cnav a:hover { text-decoration: none; }
  }

  /* ボタン */
  .btn { font: inherit; font-size: 13px; font-weight: 700; height: 36px; padding: 0 16px; border-radius: 999px; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; text-decoration: none; }
  .btn:hover { text-decoration: none; }
  .btn.pri { background: var(--accent); color: var(--on-accent); }
  .btn.sec { background: var(--btn-2); color: var(--text); }
  .btn.txt { background: none; color: var(--link); padding: 0 8px; }
  .btn:disabled { opacity: .5; cursor: default; }
  @media (max-width: 767px) { .btn { height: 44px; } .hdr .btn { height: 36px; } }
  #settings { display: none; }
  body.gh #settings { display: inline-flex; }

  /* 取得に失敗した帯 */
  .banner { background: var(--red-b); color: var(--red-t); font-size: 15px; padding: 8px 40px; text-align: center; }
  @media (max-width: 767px) { .banner { padding: 8px 16px; text-align: left; } }

  /* 全体の並び */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 40px 64px; }
  @media (max-width: 767px) { .wrap { padding: 16px 16px 48px; } }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); align-items: start; }
  .c12 { grid-column: span 12; }
  .c8 { grid-column: span 8; }
  .c4 { grid-column: span 4; }
  @media (max-width: 1099px) { .c8, .c4 { grid-column: span 12; } }
  .stack { display: grid; gap: var(--gap); min-width: 0; }
  .sep { margin-top: var(--sep); }
  section { min-width: 0; scroll-margin-top: 72px; }
  @media (max-width: 767px) { section { scroll-margin-top: 104px; } }
  .sec-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; min-width: 0; }
  .sec-h h2 { font-size: 22px; line-height: 1.3; font-weight: 700; letter-spacing: 0.01em; }
  .sec-h .cnt { font-size: 13px; color: var(--text-2); }
  .sec-h .r { margin-left: auto; font-size: 13px; color: var(--text-2); text-align: right; }
  @media (max-width: 767px) { .sec-h h2 { font-size: 20px; } }

  /* カード */
  .card { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); border: var(--card-border); padding: var(--pad); min-width: 0; }
  .card.list { padding: 0; overflow: hidden; }
  .lrow { position: relative; display: block; padding: 16px var(--pad); color: inherit; min-width: 0; }
  .lrow + .lrow::before { content: ""; position: absolute; top: 0; left: var(--pad); right: 0; border-top: 1px solid var(--line); }
  a.lrow:hover { text-decoration: none; }
  @media (hover: hover) {
    .click:hover { background: var(--fill); transition: background .15s; cursor: pointer; }
  }
  .empty { color: var(--text-2); font-size: 15px; padding: 16px var(--pad); }
  .card > .empty { padding: 0; }
  .more-row { display: flex; justify-content: center; padding: 8px var(--pad) 16px; }

  /* 札（チップ） */
  .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 700;
    line-height: 1; white-space: nowrap; vertical-align: middle; flex: none; }
  .chip.red { color: var(--red-t); background: var(--red-b); }
  .chip.org { color: var(--org-t); background: var(--org-b); }
  .chip.gry { color: var(--gry-t); background: var(--gry-b); }
  .chip.pur { color: var(--pur-t); background: var(--pur-b); }
  .chip.grn { color: var(--grn-t); background: var(--grn-b); }
  .chip.cl { color: var(--cl-t); background: var(--cl-b); }
  .chip.gp { color: var(--gp-t); background: var(--gp-b); }
  .chip.stg { color: var(--text); background: var(--fill); }
  .chip.none { color: var(--text-2); background: none; border: 1px dashed var(--line); }
  .soon { color: var(--org-t); font-weight: 700; }

  /* ドット絵の顔（丸い台の上に置く） */
  .av { position: relative; display: inline-grid; place-items: center; border-radius: 50%; background: var(--fill);
    box-shadow: inset 0 0 0 1px var(--ring); flex: none; vertical-align: middle; }
  .av svg { display: block; image-rendering: pixelated; }
  .av-s { width: 40px; height: 40px; }
  .av-m { width: 64px; height: 64px; }
  .av-l { width: 80px; height: 80px; }
  .av .ini { font-size: 15px; font-weight: 700; color: var(--text-2); }
  .av .dot { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--dot); box-shadow: 0 0 0 2px var(--card); }
  .av-m .dot { right: 2px; bottom: 2px; }
  .faces { display: inline-flex; }
  .faces .av { box-shadow: inset 0 0 0 1px var(--ring), 0 0 0 2px var(--card); }
  .faces .av + .av { margin-left: -8px; }
  .av.plus { font-size: 13px; font-weight: 700; color: var(--text-2); }
  .who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .who .lead-n { font-size: 13px; white-space: nowrap; }

  /* まとめ */
  .sum-top { display: flex; gap: 24px; align-items: center; }
  .sum-lead { font-size: 22px; line-height: 1.5; font-weight: 700; }
  .sum-sub { font-size: 15px; color: var(--text-2); margin-top: 4px; }
  .sum-ok { font-size: 15px; color: var(--text-2); margin-top: 4px; }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--gap); margin-top: 24px; }
  .tile { display: block; background: var(--fill); border-radius: 12px; padding: 16px; color: var(--text); }
  .tile:hover { text-decoration: none; }
  .tile .k { font-size: 13px; color: var(--text-2); }
  .tile .v { font-size: 34px; line-height: 1.1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 15px; font-weight: 400; margin-left: 2px; color: var(--text); }
  .tile.red .v { color: var(--red-t); } .tile.org .v { color: var(--org-t); } .tile.acc .v { color: var(--link); }
  .av-sum-s { display: none; }
  @media (max-width: 767px) {
    .sum-top { gap: 16px; align-items: flex-start; }
    .sum-lead { font-size: 19px; }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; }
    .tile .v { font-size: 28px; }
    .av-sum-l { display: none; } .av-sum-s { display: inline-grid; }
  }

  /* 最近の動き */
  .rrow { display: grid; grid-template-columns: 88px auto 96px minmax(0, 1fr); gap: 12px; align-items: center; padding-top: 8px; padding-bottom: 8px; }
  .rrow .rt { display: grid; font-size: 15px; line-height: 1.3; }
  .rrow .rt .sub { font-size: 13px; }
  .rrow .rw { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rrow .rx { font-size: 15px; }
  @media (max-width: 767px) {
    .rrow { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "av w" "av x" "av t"; gap: 0 12px; }
    .rrow .av { grid-area: av; align-self: start; }
    .rrow .rw { grid-area: w; } .rrow .rx { grid-area: x; white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .rrow .rt { grid-area: t; display: flex; gap: 8px; font-size: 13px; color: var(--text-2); }
  }

  /* 障害・遅れ */
  .brow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 16px; align-items: start; width: 100%; }
  .brow .bchips { display: flex; gap: 4px; padding-top: 2px; }
  .brow .bname { font-size: 17px; font-weight: 700; line-height: 1.5; }
  .brow .btext { font-size: 15px; }
  .brow .bside { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); white-space: nowrap; }
  @media (max-width: 767px) {
    .brow { grid-template-columns: minmax(0, 1fr); }
    .brow .btext { font-size: 16px; }
  }

  /* オーナー確認事項 */
  .ask .from { font-size: 13px; color: var(--text-2); }
  .ask .q { font-size: 17px; line-height: 1.5; overflow-wrap: anywhere; margin-top: 2px; }
  .ask.done .q { color: var(--text-2); }
  .ans { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  /* 入力欄の文字は 16px 以上（iPhone は 16px 未満の入力欄に触れると画面を拡大するため） */
  .ans input, .inp { flex: 1 1 auto; min-width: 0; height: 40px; border: 0; border-radius: 10px; background: var(--fill); color: var(--text);
    font: inherit; font-size: 16px; padding: 0 12px; -webkit-appearance: none; appearance: none; }
  .ans .btn { min-width: 72px; }
  .ask .st { margin-top: 8px; }
  @media (max-width: 767px) {
    .ans { flex-wrap: wrap; }
    .ans input { flex: 1 1 100%; height: 44px; }
    .ans .btn { flex: 1 1 calc(50% - 4px); height: 48px; }
  }

  /* 経営会議・受付 */
  .mrow .mname { font-size: 15px; font-weight: 700; }
  .mrow .mline { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 12px; align-items: center; }
  .intake .big { font-size: 28px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .intake .big small { font-size: 15px; font-weight: 400; }
  .intake .k { font-size: 13px; color: var(--text-2); }
  .intake ul { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; font-size: 15px; }
  .intake hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }

  /* 案件 */
  .pctl { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 0 0 12px; }
  .seg { display: inline-flex; background: var(--fill); border-radius: 9px; padding: 2px; flex: none; }
  .seg button { font: inherit; font-size: 13px; font-weight: 700; height: 28px; padding: 0 12px; border: 0; border-radius: 7px; background: none; color: var(--text); cursor: pointer; white-space: nowrap; }
  .seg button.on { background: var(--card); box-shadow: var(--seg-shadow); }
  .dchips { display: flex; gap: 8px; min-width: 0; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
  .dchips::-webkit-scrollbar { display: none; }
  .dchips button { font: inherit; font-size: 13px; font-weight: 700; height: 32px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--fill); color: var(--text); cursor: pointer; white-space: nowrap; flex: none; }
  .dchips button.on { background: var(--text); color: var(--card); }
  .dchips select { font: inherit; font-size: 15px; height: 32px; border-radius: 10px; border: 0; background: var(--fill); color: var(--text); padding: 0 8px; }
  .pctl-r { display: flex; gap: 16px; align-items: center; margin-left: auto; }
  .pctl-r .inp { width: 240px; flex: none; }
  .jrow { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; }
  .jrow .jid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; color: var(--text-2); }
  .jrow .jn { font-size: 15px; font-weight: 700; min-width: 0; }
  .jrow .jflow { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--text-2); }
  .jrow .jflow b { color: var(--text); font-weight: 600; }
  .jrow .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .jcount { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px var(--pad) 0; }
  .todo-add { display: flex; gap: 8px; align-items: center; }
  .todo-add .todo-due { flex: none; width: 150px; }
  .trow { display: flex; gap: 12px; align-items: center; }
  .trow .tt { flex: 1 1 auto; min-width: 0; font-size: 15px; }
  .trow .del { flex: none; width: 36px; padding: 0; color: var(--text-2); font-size: 20px; font-weight: 400; }
  .trow .del:hover { color: var(--text); }
  .trow .late { color: #d70015; }
  @media (max-width: 767px) { .todo-add { flex-wrap: wrap; } .todo-add #todo-t { flex: 1 1 100%; height: 44px; } .todo-add .todo-due { flex: 1 1 auto; width: auto; height: 44px; } .trow .del { width: 44px; height: 44px; } }
  .sw { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; white-space: nowrap; }
  .sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .sw .tr { width: 40px; height: 24px; border-radius: 999px; background: var(--btn-2); position: relative; transition: background .15s; flex: none; }
  .sw .tr::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .sw input:checked + .tr { background: var(--accent); }
  .sw input:checked + .tr::after { transform: translateX(16px); }
  .sw input:focus-visible + .tr { outline: 3px solid rgba(0,113,227,0.4); outline-offset: 2px; }
  @media (max-width: 767px) {
    .pctl-r { margin-left: 0; width: 100%; flex-wrap: wrap; gap: 8px; }
    .pctl-r .inp { width: 100%; height: 44px; order: -1; }
    .dchips { flex-basis: 100%; }
  }

  .prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head due" "next who" "blk blk" "meta meta"; gap: 4px 16px; }
  .p-head { grid-area: head; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
  .p-head .c-src { order: 0; }
  .p-head .pname { order: 1; }
  .p-head .chip:not(.c-src) { order: 2; }
  .pname { font: inherit; font-size: 17px; font-weight: 700; line-height: 1.5; color: var(--text); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; min-width: 0; overflow-wrap: anywhere; }
  .p-due { grid-area: due; font-size: 13px; color: var(--text-2); white-space: nowrap; text-align: right; padding-top: 2px; }
  .p-next { grid-area: next; font-size: 15px; min-width: 0; align-self: center; }
  .p-next .lbl, .p-blk .lbl { font-size: 13px; color: var(--text-2); margin-right: 4px; }
  .p-who { grid-area: who; justify-self: end; }
  .p-blk { grid-area: blk; font-size: 15px; color: var(--red-t); }
  .p-blk .lbl { color: var(--red-t); }
  .p-meta { grid-area: meta; font-size: 13px; color: var(--text-2); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; }
  .p-meta > span { display: inline-flex; align-items: center; gap: 4px; }
  .p-meta > span + span::before { content: "・"; margin: 0 8px; color: var(--text-2); }
  .pbar { display: inline-block; width: 64px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-left: 4px; }
  .pbar i { display: block; height: 100%; background: var(--text-2); }
  .p-exp { grid-column: 1 / -1; }
  @media (max-width: 767px) {
    .prow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "head head" "next next" "blk blk" "who due" "meta meta"; }
    .p-head .pname { order: 3; flex-basis: 100%; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
    .p-next { font-size: 16px; }
    .p-next .clamp1 { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .p-blk { font-size: 16px; }

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const DONE = new Set(['納品済み', '中止', '完了']);

// ---- 時刻（日本時間） ----
const pad = (n) => String(n).padStart(2, '0');
const jst = (t) => { const x = new Date(t + 9 * 3600e3); return { y: x.getUTCFullYear(), mo: x.getUTCMonth() + 1, d: x.getUTCDate(), h: x.getUTCHours(), mi: x.getUTCMinutes() }; };
const todayJst = () => { const p = jst(Date.now()); return `${p.y}-${pad(p.mo)}-${pad(p.d)}`; };
function dateOf(s) { const m = String(s || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? Date.UTC(+m[1], m[2] - 1, +m[3]) : null; }
function daysLeft(s) { const d = dateOf(s); return d === null ? null : Math.round((d - dateOf(todayJst())) / 864e5); }

function fmtAt(iso) {

}
const hm = (iso) => { const t = Date.parse(iso); if (isNaN(t)) return ''; const p = jst(t); return `${pad(p.h)}:${pad(p.mi)}`; };
// カードに人が書いた日付（YYYY-MM-DD または YYYY-MM-DD HH:MM）→「M/D」「M/D HH:MM」
function fmtDay(s) { const m = String(s || '').match(/\d{4}-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/); return m ? `${+m[1]}/${+m[2]}${m[3] ? ` ${pad(m[3])}:${m[4]}` : ''}` : String(s || ''); }

  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (isNaN(m)) return '';
  if (m < 1) return 'たった今';
  if (m < 60) return `${m}分前`;

}

  const m = Math.max(0, Math.round((Date.parse(iso) - Date.now()) / 60000));
  return m < 60 ? `あと${m}分` : `あと${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}`;
}
const cut = (t, n) => { t = String(t || '').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
const shortName = (n) => String(n || '').replace(/\s*[（(].*[）)]\s*$/, '');

// ---- 札・顔 ----
const chip = (cls, text) => `<span class="chip ${cls}">${esc(text)}</span>`;
const NONE = chip('none', '未記入');
const NOGET = chip('none', '未取得');
const faceCache = new Map(); // 名前と大きさごとに1回だけ作る（100件でも重くしない）
const PX = { s: 32, m: 48, l: 64 };
const whoName = (n) => Sprites.who(n) || String(n || '').replace(/[（(].*$/, '').trim();
function av(name, size = 's', opt = {}) {
  const id = Sprites.who(name);
  const label = opt.label || whoName(name) || '未登録';
  let inner;
  if (id) {
    const key = id + '|' + PX[size];
    if (!faceCache.has(key)) faceCache.set(key, Sprites.svg(id, PX[size]).replace('<svg ', '<svg aria-hidden="true" focusable="false" '));
    inner = faceCache.get(key);
  } else inner = `<span class="ini" aria-hidden="true">${esc(label.charAt(0) || '?')}</span>`;
  return `<span class="av av-${size}${opt.cls ? ' ' + opt.cls : ''}" role="img" aria-label="${esc(label)}" title="${esc(label)}">${inner}${opt.busy ? '<i class="dot"></i>' : ''}</span>`;
}
let busySet = new Set();

// 案件の責任者（先頭・名前つき）と担当（顔だけ）
function people(p) {
  const out = []; const seen = new Set();
  const add = (n) => { const id = whoName(n); if (id && !seen.has(id)) { seen.add(id); out.push(id); } };
  if (p.lead) add(p.lead);
  String(p.owner || '').split(/[・、,，/／&＆+＋\s]+/).filter(Boolean).forEach(add);
  return out;
}
function facesHtml(p) {
  const ns = people(p);
  const lead = p.lead ? ns[0] : null;
  const rest = lead ? ns.slice(1) : ns;
  let h = lead
    ? `<span class="who">${av(lead, 's', { busy: busySet.has(lead) })}<span class="lead-n">${esc(lead)}</span></span>`
    : `<span class="who"><span class="sub">責任者</span>${NONE}</span>`;
  if (rest.length) {
    const show = rest.length > 4 ? rest.slice(0, 3) : rest;
    h += `<span class="faces">${show.map((n) => av(n, 's', { busy: busySet.has(n) })).join('')}${rest.length > 4 ? `<span class="av av-s plus" title="${esc(rest.slice(3).join('、'))}">+${rest.length - 3}</span>` : ''}</span>`;
  }
  return `<span class="who">${h}</span>`;
}

// ---- 案件の状態（障害・遅れ・古い・未同期）。推測はしない：書かれた項目と日付だけで決める ----
const infoCache = new Map();
function info(p) {
  if (infoCache.has(p)) return infoCache.get(p);
  const done = DONE.has(p.stage);
  const dl = p.internalDue ? ['社内締切', p.internalDue] : p.due ? ['納期', p.due] : null;
  const left = dl ? daysLeft(dl[1]) : null;
  const over = !done && left !== null && left < 0 ? -left : 0;
  const late = !done && (!!p.risk || over > 0);
  const blocked = !done && !!p.blocker;
  const upd = p.updated ? daysLeft(p.updated) : null;
  const age = upd === null ? null : -upd;
  const stale = !done && age !== null && age > (p.staleDays || 3) ? age : null;
  let unsynced = null;
  if (p.source === 'GPT' && !done && lastState && lastState.ops && lastState.ops.gptSyncKnown) {
    // 未同期は PC のサーバーが覚えている最後の取り込み時刻で判断する（スマホ版では判断しない）。
    // サーバーの起動から一度も成功していなければ「未同期」（オウホン検査 軽微2）
    const t = lastState.ops.gptSync ? Date.parse(lastState.ops.gptSync) : NaN;
    if (isNaN(t)) unsynced = -1;
    else if (Date.now() - t > 3600e3) unsynced = Math.floor((Date.now() - t) / 3600e3);
  }
  const r = { done, dl, left, over, late, blocked, age, stale, unsynced, need: blocked || late || stale !== null || unsynced !== null };
  infoCache.set(p, r);
  return r;
}
const deptName = (d) => (!d ? '' : /(事業部|部)$/.test(d) ? d : d + '事業部');
function stateChips(p, i) {
  let h = '';
  if (i.blocked) h += chip('red', '障害');
  if (i.late && !i.over) h += chip('org', '遅れ');
  if (i.stale !== null) h += chip('gry', `古い・${i.stale}日前`);
  if (i.unsynced !== null) h += chip('pur', i.unsynced < 0 ? '未同期' : `未同期・${i.unsynced}時間前`);
  return h;
}
// 状態の色は1組（Paperclip の DESIGN.md「Status is systematic」を写した）：止まっている＝赤、検査中＝紫、納品待ち・完了＝緑、まだ＝灰、手を動かしている＝無地
const STAGE_TONE = { '止まっている': 'red', 'blocked': 'red', 'テスト': 'pur', '検査中': 'pur', 'in_review': 'pur', '納品待ち': 'grn', '納品済み': 'grn', '完了': 'grn', 'done': 'grn', '要件定義': 'gry', '未着手': 'gry', '待ち': 'gry', 'todo': 'gry', '中止': 'gry' };
function stageChip(p) { return chip(STAGE_TONE[p.stage] || 'stg', p.stage); }
function srcChip(p) { return p.source === 'GPT' ? '<span class="chip gp c-src">GPT</span>' : '<span class="chip cl c-src">Claude</span>'; }
function dueHtml(i) {
  if (!i.dl) return `<span class="sub">期限</span> ${NONE}`;
  const [label, v] = i.dl;
  if (i.left === null) return `${esc(label)} ${esc(cut(v, 16))}`;
  const day = `${esc(label)} <span class="tnum">${esc(fmtDay(v))}</span>`;
  if (i.done) return day;
  if (i.over) return `${day} ${chip('org', `${i.over}日超過`)}`;
  if (i.left === 0) return `${day} <span class="soon">本日まで</span>`;
  return i.left <= 3 ? `${day} <span class="soon">あと${i.left}日</span>` : `${day} あと${i.left}日`;
}
function sortActive(list) {
  const rank = (p) => { const i = info(p); return i.blocked ? 0 : i.late ? 1 : i.left !== null ? 2 : 3; };
  return list.slice().sort((a, b) => {
    const ra = rank(a), rb = rank(b);
    if (ra !== rb) return ra - rb;
    const ia = info(a), ib = info(b);
    if (ra <= 1 && ib.over !== ia.over) return ib.over - ia.over;
    if (ra <= 2 && ia.left !== ib.left) return (ia.left ?? 1e9) - (ib.left ?? 1e9);
    return String(b.updated).localeCompare(String(a.updated)) || a.name.localeCompare(b.name, 'ja');
  });
}

const repoName = () => store.get('gh_repo') || (lastState && lastState.repo) || '';
function cardUrl(p) {
  if (p.source === 'GPT') return p.url;
  const r = repoName();
  return r ? `https://github.com/${r}/blob/main/${p.path.split('/').map(encodeURIComponent).join('/')}` : '';
}
function schedHtml(rows) {
  if (!rows || !rows.length) return '';
  return `<div><h4>日程</h4><ul class="sched">${rows.map((r) => {
    const done = /完了/.test(r.state);
    const doing = !done && /進行|作業中|制作中/.test(r.state);
    const d = daysLeft(r.date);
    const late = !done && d !== null && d < 0;
    const st = done ? chip('grn', '完了') : doing ? chip('stg', '作業中') : chip('gry', '未着手');
    const tag = /社内締切/.test(r.date) ? '（社内締切）' : '';
    return `<li><span class="dt">${esc(fmtDay(r.date))}</span><span class="tk">${esc(r.task)}${tag}${r.who ? `<small>${esc(r.who)}</small>` : ''}</span><span class="st">${late ? chip('org', '遅れ') : ''}${st}</span></li>`;
  }).join('')}</ul></div>`;
}
function expHtml(p) {
  const parts = [];
  if (p.blocker) parts.push(`<div><h4>障害</h4><p>${esc(p.blocker)}</p></div>`);
  if (p.risk) parts.push(`<div><h4>遅れの理由</h4><p>${esc(p.risk)}</p></div>`);
  if (p.next) parts.push(`<div><h4>次の行動</h4><p>${esc(p.next)}</p></div>`);
  if (p.working) parts.push(`<div><h4>作業中</h4><p>${esc(p.working)}</p></div>`);
  parts.push(schedHtml(p.schedule));
  const logs = (p.log || []).map((l, i) => ({ ...l, i })).sort((a, b) => b.date.localeCompare(a.date) || b.i - a.i).slice(0, 3);
  if (logs.length) parts.push(`<div><h4>最新のログ</h4><ul class="logs">${logs.map((l) => `<li><span class="dt">${esc(fmtDay(l.date))}</span><b>${esc(l.who)}</b>${esc(l.text)}</li>`).join('')}</ul></div>`);
  const meta = [p.client, p.kind, p.amount, p.priority ? `優先度 ${p.priority}` : ''].filter(Boolean);
  if (meta.length) parts.push(`<p class="sub">${meta.map(esc).join(' ・ ')}</p>`);
  const links = [];
  const cu = cardUrl(p);
  if (cu) links.push(`<a href="${esc(cu)}" target="_blank" rel="noopener">${p.source === 'GPT' ? 'Issue を開く' : 'カードを開く'} ↗</a>`);
  if (p.url && p.source !== 'GPT') links.push(`<a href="${esc(p.url)}" target="_blank" rel="noopener">URL ↗</a>`);
  if (links.length) parts.push(`<div class="links">${links.join('')}</div>`);
  return `<div class="exp">${parts.filter(Boolean).join('')}</div>`;
}
function metaHtml(p) {
  const m = [];
  if (p.deliverable) m.push(`<span><a href="${esc(p.deliverable)}" target="_blank" rel="noopener">成果物 ↗</a></span>`);
  m.push(p.progress === null || p.progress === undefined
    ? `<span>進捗 ${NONE}</span>`
    : `<span>進捗 <span class="tnum">${p.progress}%</span><span class="pbar" aria-hidden="true"><i style="width:${p.progress}%"></i></span></span>`);
  m.push(p.updated ? `<span>最終更新 <span class="tnum">${esc(fmtDay(p.updated))}</span>（申告）</span>` : `<span>最終更新 ${NONE}</span>`);
  m.push(p.commitAt ? `<span>コミット <span class="tnum">${esc(fmtAt(p.commitAt))}</span></span>` : `<span>コミット ${NOGET}</span>`);
  // GPT 側：カードの時刻は「内容が最後に変わった取り込み」。取り込みの成否は稼働状況の「GPT の同期」で見る（オウホン検査 軽微3）
  if (p.source === 'GPT') m.push(p.synced && !isNaN(Date.parse(p.synced)) ? `<span>内容の取り込み <span class="tnum">${esc(fmtAt(p.synced))}</span></span>` : `<span>内容の取り込み ${NOGET}</span>`);
  return `<div class="p-meta">${m.join('')}</div>`;
}
function projRow(p) {

    <div class="p-due">${dueHtml(i)}</div>
    <div class="p-next">${p.next ? `<div class="clamp1"><span class="lbl">次：</span>${esc(p.next)}</div>` : `<span class="lbl">次：</span>${NONE}`}</div>

}

const todoName = (p) => String(p.name || '').replace(/^TODO[:：]\s*/, '');
function renderTodos(list) {

  const items = list.slice().sort((a, b) => (isDay(a.due) ? a.due : '9999').localeCompare(isDay(b.due) ? b.due : '9999') || String(a.path).localeCompare(String(b.path)));

  $('todo-n').textContent = items.length + '件';
  const today = new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
  $('todos').innerHTML = items.length ? items.map((p) => {
    const over = isDay(p.due) && p.due.slice(0, 10) < today;
    const who = p.owner && p.owner !== '未割当' ? p.owner : (p.lead || '');
    return '<div class="lrow trow">'

async function saveTodo(body) {
  const at = new Date().toISOString();
  if (LOCAL) {
    const r = await fetch('/api/todo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({}, body, { at })) });
    if (!r.ok) throw new Error(await r.text());
    return;
  }
  const repo = store.get('gh_repo');
  const head = { Authorization: 'Bearer ' + store.get('gh_token'), Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
  const url = (f) => 'https://api.github.com/repos/' + repo + '/contents/' + f.split('/').map(encodeURIComponent).join('/');
  let r;
  if (body.op === 'add') {
    const f = Parse.todoPath(body.title, at);
    r = await fetch(url(f), { method: 'PUT', headers: head, body: JSON.stringify({ message: 'TODO を追加（オーナー）: ' + Parse.todoTitle(body.title), content: utf8Base64(Parse.todoFile(body.title, body.due, at)) }) });
  } else {
    if (!Parse.isTodoPath(body.path)) throw new Error('消せない場所です');
    const g = await fetch(url(body.path), { headers: head, cache: 'no-store' });
    if (g.status === 404) return; // もう消えている
    if (!g.ok) throw new Error('GitHub から読めませんでした（' + g.status + '）');
    const { sha } = await g.json();
    r = await fetch(url(body.path), { method: 'DELETE', headers: head, body: JSON.stringify({ message: 'TODO を削除（オーナー）: ' + body.path.replace(/^.*\//, '').replace(/\.md$/, ''), sha }) });
  }
  if (r.status === 403 || r.status === 404) throw new Error('トークンに書き込みの権限がありません。Contents を「Read and write」にしたトークンを作り直し、「設定」から入れ直してください。');
  if (!r.ok) throw new Error('GitHub に保存できませんでした（' + r.status + '）');
}

// ---- データの読み込み ----
// PC（localhost）では server.js から、それ以外（スマホ）では GitHub から直接読む
const blobCache = new Map(); // sha → 中身（変わったファイルだけ取り直す）
let netError = false;

async function gh(path, raw) {
  const r = await fetch('https://api.github.com' + path, {
    headers: {
      Authorization: 'Bearer ' + store.get('gh_token'),
      Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
    cache: 'no-store',
  });
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return raw ? r.text() : r.json();
}

async function stateFromGitHub() {
  const repo = store.get('gh_repo');
  const commits = await gh(`/repos/${repo}/commits?per_page=15`); // 先頭が最新。最近の動きにも使う
  const commit = commits[0];
  const tree = await gh(`/repos/${repo}/git/trees/${commit.sha}?recursive=1`);
  const blobs = tree.tree.filter((t) => t.type === 'blob' && Parse.wanted(t.path));
  const keep = new Set(Parse.narrow(blobs.map((b) => b.path)));
  const files = {};
  await Promise.all(blobs.filter((b) => keep.has(b.path)).map(async (b) => {
    if (!blobCache.has(b.sha)) blobCache.set(b.sha, await gh(`/repos/${repo}/git/blobs/${b.sha}`, true));
    files[b.path] = blobCache.get(b.sha);
  }));
  const c = commit.commit;
  return Parse.buildState(files, {
    repo,
    recent: commits.map((x) => ({ at: x.commit.committer.date, subject: x.commit.message.split('\n')[0], author: x.commit.author.name })),
    lastCommit: { at: c.committer.date, message: c.message.split('\n')[0], author: c.author.name },
    sync: { at: new Date().toISOString(), ok: true, message: '' },
  });
}

let loading = false;
async function load() {
  if (loading) return;
  // 設定画面を開いている間は読み直さない（入れかけのトークンが消えるため。オウホン検査 軽微5）
  if (!LOCAL && $('setup') && $('setup').classList.contains('show')) return;
  loading = true;
  try {
    if (LOCAL) {
      const r = await fetch('/api/state', { cache: 'no-store' });
      netError = false;
      render(await r.json());
    } else if (!store.get('gh_token') || !store.get('gh_repo')) {
      showSetup('', true);
    } else {
      const st = await stateFromGitHub();
      netError = false;
      render(st);
    }
  } catch (e) {
    if (LOCAL) { say('サーバーに接続できません。\nデスクトップのアイコンから起動し直してください。'); }
    else if (e.status === 401) showSetup('トークンが無効か、期限切れです。新しいトークンを入力してください。', true);
    else if (e.status === 403 || e.status === 404) showSetup('リポジトリが見つからないか、トークンに読み取り権限がありません。', true);
    else { netError = true; $('syncerr').hidden = !lastState; say('GitHub に接続できません。\n電波の良いところで「更新」を押してください。'); }
  } finally {
    loading = false;
  }
}

// ---- オーナー確認事項への回答 ----
let askMap = {};
const drafts = {}; // 入力中のひとこと（再描画で消えないように覚えておく）

function utf8Base64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

async function saveAnswer(ask, answer, comment) {
  const at = new Date().toISOString();
  if (LOCAL) {
    const r = await fetch('/api/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ask, answer, comment, at }),
    });
    if (!r.ok) throw new Error(await r.text());
    return;
  }
  const repo = store.get('gh_repo');
  const path = Parse.answerPath(ask, at);
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    method: 'PUT',
    headers: {
      Authorization: 'Bearer ' + store.get('gh_token'),
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
    body: JSON.stringify({ message: `オーナーの回答: ${answer}（${ask.from}）`, content: utf8Base64(Parse.answerFile(ask, answer, comment, at)) }),
  });
  if (r.status === 403 || r.status === 404) {
    const e = new Error('トークンに書き込みの権限がありません。Contents を「Read and write」にしたトークンを作り直し、「設定」から入れ直してください。');
    e.permission = true;
    throw e;
  }
  if (!r.ok) throw new Error('GitHub に保存できませんでした（' + r.status + '）');
}

// 応募一覧：スマホから「応募文をコピー」「送った」（2026-11-23 オーナー「両方やろう」）
$('apps').addEventListener('click', async (ev) => {
  const c = ev.target.closest('button[data-copy]');
  const s = ev.target.closest('button[data-sent]');
  const a = (window.__apps || {})[(c || s || {}).dataset?.copy || (c || s || {}).dataset?.sent];
  if (!a) return;
  if (c) {
    try { await navigator.clipboard.writeText(a.text); say('応募文をコピーしました。\n案件ページの応募欄に貼ってください。'); }
    catch (e) { window.prompt('コピーしてください', a.text); }
    return;
  }
  if (!confirm('「' + a.name + '」の応募を送りましたか？')) return;
  const ask = { id: 'app-' + a.file.replace(/\.md$/, ''), kind: '応募', target: a.path, from: '応募一覧', text: 'この応募をオーナーが送った' };
  try { await saveAnswer(ask, 'OK', 'オーナーがスマホから送信'); say('記録しました。オウセンが「応募済み」にします。'); s.disabled = true; s.textContent = '記録済み'; }
  catch (e) { say(e.message); }
});

$('asks').addEventListener('input', (ev) => {
  if (ev.target.classList.contains('ans-c')) drafts[ev.target.dataset.id] = ev.target.value;
});
$('asks').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button[data-ans]');
  if (!btn) return;
  const ask = askMap[btn.dataset.id];
  if (!ask) return;
  const answer = btn.dataset.ans;
  const comment = drafts[ask.id] || '';
  if (answer === 'NG' && !comment.trim()) {
    say('NG のときは、理由やどうしてほしいかを\nひとこと書いてから押してください。');
    return;
  }
  btn.closest('.ans').querySelectorAll('button,input').forEach((el) => { el.disabled = true; });
  try {
    await saveAnswer(ask, answer, comment);
    delete drafts[ask.id];
    say(`回答を受け取りました（${answer}）。\nオウセンが反映します。`);
    setTimeout(load, 1500);
  } catch (e) {
    say(e.message);
    btn.closest('.ans').querySelectorAll('button,input').forEach((el) => { el.disabled = false; });
  }
});

$('todo-form').onsubmit = async (ev) => {
  ev.preventDefault();
  const title = $('todo-t').value.trim();
  if (!title) { $('todo-t').focus(); return; }
  const btn = ev.target.querySelector('button');
  btn.disabled = true;
  try {
    await saveTodo({ op: 'add', title, due: $('todo-d').value });
    $('todo-t').value = ''; $('todo-d').value = '';
    say('TODO を追加しました。');
    setTimeout(load, LOCAL ? 1500 : 2500);
  } catch (e) { say(e.message); }
  btn.disabled = false;
};
$('todos').addEventListener('click', async (ev) => {
  const b = ev.target.closest('button[data-del]');
  if (!b) return;
  const p = todoMap[b.dataset.del];
  if (!p || !confirm('「' + todoName(p) + '」を削除しますか？\n（記録は git の履歴に残ります）')) return;
  b.disabled = true;
  try {
    await saveTodo({ op: 'del', path: p.path });
    b.closest('.trow').remove();
    say('TODO を削除しました。');
    setTimeout(load, LOCAL ? 1500 : 2500);
  } catch (e) { say(e.message); b.disabled = false; }
});

$('setup-form').onsubmit = (ev) => {
  ev.preventDefault();
  const repo = $('f-repo').value.trim().replace(/^https:\/\/github\.com\//, '').replace(/\/$/, '');
  const token = $('f-token').value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { $('f-err').textContent = 'リポジトリは「ユーザー名/リポジトリ名」の形で入力してください。'; return; }
  if (!token) { $('f-err').textContent = 'トークンを入力してください。'; return; }
  store.set('gh_repo', repo);
  store.set('gh_token', token);
  blobCache.clear();
  $('setup').classList.remove('show');
  say('読み込み中…');
  load();
};
$('f-forget').onclick = () => { store.del('gh_token'); store.del('gh_repo'); showSetup('設定を消しました。', true); };
$('settings').onclick = () => showSetup();
if (!LOCAL) document.body.classList.add('gh');

$('refresh').onclick = async () => {
  $('refresh').disabled = true;
  if (LOCAL) {
    await fetch('/api/pull', { method: 'POST' }).catch(() => {});
    setTimeout(() => { load(); $('refresh').disabled = false; }, 4000);
  } else {
    await load();
    $('refresh').disabled = false;
  }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
setInterval(load, LOCAL ? 30000 : 120000);
if (!LOCAL && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
