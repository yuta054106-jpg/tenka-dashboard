<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TENKA LAB</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07071c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TENKA LAB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #07071c; --win: #000000; --line: #ffffff; --text: #ffffff; --sub: #a9a9c8; --faint: #6d6d8f;
    --gold: #ffd23f; --hp: #4ade80; --mid: #ffd23f; --low: #ff5a5a; --mp: #5aa9ff;
    --s-req: #b28cff; --s-make: #5aa9ff; --s-test: #3fe0d0; --s-wait: #ffa63f; --s-done: #4ade80; --s-stop: #8f8fa8;
  }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0; color: var(--text); background: var(--page);
    background-image: radial-gradient(#ffffff14 1px, transparent 1px);
    background-size: 22px 22px;
    font-family: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
    font-size: 15px; line-height: 1.6; letter-spacing: .04em;
    -webkit-font-smoothing: none; image-rendering: pixelated;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 18px 20px 150px; }
  @media (max-width: 640px) { .wrap { padding: 12px 16px 170px; } }

  /* RPG ウィンドウ */
  .win {
    background: var(--win); border: 3px solid var(--line); border-radius: 8px;
    box-shadow: 0 0 0 3px var(--win), 0 6px 0 3px #0008; padding: 14px 16px 16px; position: relative;
  }
  .win > .tab {
    position: absolute; top: -13px; left: 14px; background: var(--win); padding: 0 8px; font-size: 13px;
    color: var(--text); letter-spacing: .1em;
  }

  header.win { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  header .avatar { width: 52px; height: 52px; }
  header h1 { font-size: 22px; margin: 0; font-weight: 400; letter-spacing: .12em; }
  header .sub { color: var(--sub); font-size: 13px; }
  header .spacer { flex: 1; }
  button {
    font: inherit; color: var(--text); background: var(--win); border: 2px solid var(--line); border-radius: 6px;
    padding: 6px 14px; cursor: pointer; letter-spacing: .08em;
  }
  button:hover, button:focus-visible { background: #fff; color: #000; outline: none; }
  button:disabled { opacity: .5; cursor: wait; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 26px 22px; }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 26px; min-width: 0; }

  /* ステータス（KPI） */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 18px; }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat .label { color: var(--sub); font-size: 13px; }
  .stat .value { font-size: 30px; color: var(--gold); line-height: 1.2; }
  .stat .value small { font-size: 14px; color: var(--text); margin-left: 4px; }
  .stat.alert .value { color: var(--low); }

  /* クエスト */
  .quests { display: flex; flex-direction: column; gap: 4px; }
  .quest { display: grid; grid-template-columns: 22px minmax(0, 1fr) 170px 120px; gap: 4px 14px; align-items: center;
    padding: 10px 6px; border-bottom: 2px dashed #ffffff26; }
  .quest:last-child { border-bottom: 0; }
  @media (max-width: 760px) { .quest { grid-template-columns: 22px 1fr; } .quest > .bars, .quest > .who { grid-column: 2; } }
  .cursor { color: var(--text); visibility: hidden; }
  .quest:hover .cursor, .quest.first .cursor { visibility: visible; animation: blink 1s steps(2) infinite; }
  .q-name { font-size: 17px; overflow-wrap: anywhere; }
  .q-meta { color: var(--sub); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .q-meta .reward { color: var(--gold); }
  .q-next { grid-column: 2 / -1; font-size: 13px; color: var(--text); }
  .q-next::before { content: "次 ▷ "; color: var(--sub); }
  .due.soon { color: var(--mid); }
  .due.over { color: var(--low); animation: blink 1s steps(2) infinite; }
  .stage { font-size: 13px; }
  .bar { height: 12px; border: 2px solid var(--line); border-radius: 3px; background: #222; margin-top: 4px; padding: 1px; }
  .bar i { display: block; height: 100%; background: var(--hp); }
  .bar.mp i { background: var(--mp); }
  .num { font-size: 13px; color: var(--sub); }
  .who { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .avatar { width: 36px; height: 36px; flex: none; image-rendering: pixelated; }
  .avatar svg { width: 100%; height: 100%; display: block; }

  /* パーティ */
  .party { display: grid; gap: 10px; }
  .member { display: grid; grid-template-columns: 40px 1fr auto; gap: 0 10px; align-items: center; }
  .member .avatar { width: 40px; height: 40px; }
  .member .n { font-size: 15px; }
  .member .j { color: var(--sub); font-size: 12px; margin-left: 6px; }
  .member .r { color: var(--sub); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member .st { font-size: 12px; text-align: right; white-space: nowrap; }
  .member .st.busy { color: var(--gold); }
  .member .st.free { color: var(--faint); }
  .member.busy .avatar { animation: bob 1s steps(2) infinite; }

  /* 冒険の記録 */
  .rows { display: grid; gap: 6px; font-size: 14px; }
  .rows .row { display: flex; justify-content: space-between; gap: 10px; }
  .rows .row > span:first-child { color: var(--sub); white-space: nowrap; }
  .rows .row > span:last-child { text-align: right; }
  .status { padding: 6px 10px; border: 2px solid currentColor; border-radius: 6px; margin-bottom: 8px; }
  .status.ok { color: var(--hp); } .status.warn { color: var(--low); } .status.idle { color: var(--sub); }

  ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
  ul.list li { padding-left: 20px; position: relative; overflow-wrap: anywhere; }
  ul.list li::before { content: "◆"; position: absolute; left: 0; color: var(--gold); font-size: 11px; top: 3px; }
  ul.list li .from { display: block; color: var(--sub); font-size: 12px; }
  .ans { display: flex; gap: 6px; margin-top: 6px; }
  .ans input { flex: 1; min-width: 0; font: inherit; font-size: 14px; color: var(--text); background: #111;
    border: 2px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .ans button { padding: 4px 12px; }
  .answered { color: var(--hp); font-size: 12px; margin-top: 4px; }
  .empty { color: var(--faint); font-size: 14px; padding: 10px 2px; }

  /* メッセージウィンドウ */
  .message {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    width: min(1240px, calc(100% - 32px)); min-height: 96px; font-size: 17px; line-height: 1.8; z-index: 5;
  }
  .message .more { position: absolute; right: 16px; bottom: 6px; animation: blink 0.8s steps(2) infinite; }
  .message p { margin: 0; white-space: pre-wrap; }

  /* スマホ版の初期設定 */
  .setup { position: fixed; inset: 0; background: #07071ce8; z-index: 10; display: none; place-items: center; padding: 16px; }
  .setup.show { display: grid; }
  .setup .win { width: min(520px, 100%); }
  .setup h2 { font-size: 18px; font-weight: 400; margin: 6px 0 10px; }
  .setup p { font-size: 13px; color: var(--sub); margin: 0 0 12px; }
  .setup label { display: block; font-size: 13px; margin: 12px 0 4px; }
  .setup input { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: #111; border: 2px solid var(--line);
    border-radius: 6px; padding: 8px 10px; }
  .setup .err { color: var(--low); min-height: 1.6em; margin-top: 10px; font-size: 13px; }
  .setup .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  @media (max-width: 560px) {
    header.win { flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 18px; }
    header .spacer { flex-basis: 100%; height: 0; }
    .message { font-size: 15px; min-height: 84px; bottom: max(12px, env(safe-area-inset-bottom)); }
  }
  #settings { display: none; }
  body.gh #settings { display: inline-block; }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="win">
    <span class="avatar" id="h-avatar"></span>
    <div>
      <h1 id="company">社名未定</h1>
      <div class="sub">CEO オウセン ／ 最終更新 <span id="updated">—</span></div>
    </div>
    <div class="spacer"></div>
    <button id="settings" title="スマホ版の設定">⚙</button>
    <button id="refresh" title="GitHub から最新を取得">▶ 最新を取得</button>
  </header>

  <div class="grid">
    <div class="col">
      <section class="win">
        <span class="tab">ステータス</span>
        <div class="stats">
          <div class="stat"><div class="label">進行中の案件</div><div class="value" id="k-active">–</div></div>
          <div class="stat"><div class="label">未着手の案件</div><div class="value" id="k-inbox">–</div></div>
          <div class="stat" id="kpi-due"><div class="label">7日以内の納期</div><div class="value" id="k-due">–</div></div>
          <div class="stat" id="kpi-ask"><div class="label">オーナー確認待ち</div><div class="value" id="k-ask">–</div></div>
        </div>
      </section>

      <section class="win">
        <span class="tab">案件一覧</span>
        <div class="quests" id="projects"></div>
      </section>
    </div>

    <aside class="col">
      <section class="win">
        <span class="tab">チーム</span>
        <div class="party" id="team"></div>
      </section>
      <section class="win">
        <span class="tab">稼働状況</span>
        <div class="rows" id="ops"></div>
      </section>
      <section class="win">
        <span class="tab">オーナー確認事項</span>
        <div id="asks"></div>
      </section>
      <section class="win">
        <span class="tab">未着手の案件</span>
        <div id="inbox"></div>
      </section>
    </aside>
  </div>
</div>

<div class="win message" id="message" aria-live="polite"><p id="msg"></p><span class="more">▼</span></div>

<div class="setup" id="setup">
  <form class="win" id="setup-form" autocomplete="off">
    <span class="tab">はじめの設定</span>
    <h2>スマホで会社のようすを見る</h2>
    <p>案件データは非公開の GitHub リポジトリから直接読み込みます。入力した内容は、このスマホのブラウザの中にだけ保存されます。</p>
    <label for="f-repo">リポジトリ（ユーザー名/リポジトリ名）</label>
    <input id="f-repo" placeholder="username/ai-company" autocapitalize="off" spellcheck="false">
    <label for="f-token">GitHub トークン（読み取り専用）</label>
    <input id="f-token" type="password" placeholder="github_pat_..." autocapitalize="off" spellcheck="false">
    <div class="err" id="f-err"></div>
    <div class="actions">
      <button type="button" id="f-forget">設定を消す</button>
      <button type="submit">▶ はじめる</button>
    </div>
  </form>
</div>

<script src="sprites.js"></script>
<script src="parse.js"></script>
<script>
const STAGE_COLOR = { '要件定義': '--s-req', '制作中': '--s-make', 'テスト': '--s-test', '納品待ち': '--s-wait', '納品済み': '--s-done', '中止': '--s-stop' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const face = (name) => Sprites.svg(Sprites.who(name) || name, 32);

function fmtTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'たった今';
  if (m < 60) return `${m}分前`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h}時間前` : `${Math.round(h / 24)}日前`;
}
function until(iso) {
  const m = Math.max(0, Math.round((new Date(iso) - Date.now()) / 60000));
  return m < 60 ? `あと${m}分` : `あと${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}`;
}
function daysLeft(due) {
  const m = String(due || '').match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return Math.round((new Date(+m[1], m[2] - 1, +m[3]) - today) / 86400000);
}
function dueLabel(due) {
  const d = daysLeft(due);
  if (d === null) return `<span class="due">納期 ${due ? esc(due) : '未定'}</span>`;
  const cls = d < 0 ? 'over' : d <= 3 ? 'soon' : '';
  const txt = d < 0 ? `${-d}日超過` : d === 0 ? '本日まで' : `あと${d}日`;
  return `<span class="due ${cls}">納期 ${esc(due)}（${txt}）</span>`;
}
const hpColor = (p) => (p >= 70 ? 'var(--hp)' : p >= 30 ? 'var(--mid)' : 'var(--low)');

// ---- メッセージウィンドウ（文字送り） ----
let msgQueue = [], msgIndex = 0, typing = null;
function typeMessage(text) {
  clearInterval(typing);
  const el = $('msg'); el.textContent = '';
  let i = 0;
  typing = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(typing); }, 45);
}
function nextMessage() {
  if (!msgQueue.length) return;
  typeMessage(msgQueue[msgIndex % msgQueue.length]);
  msgIndex++;
}
$('message').onclick = nextMessage;
setInterval(nextMessage, 7000);

function render(s) {
  const name = s.company || '社名未定';
  $('company').textContent = name;
  document.title = 'TENKA LAB';
  $('updated').textContent = fmtTime(s.now);
  $('h-avatar').innerHTML = Sprites.svg('オウセン', 52);

  const active = s.projects.filter((p) => !['納品済み', '中止'].includes(p.stage))
    .sort((a, b) => (daysLeft(a.due) ?? 9999) - (daysLeft(b.due) ?? 9999));
  const finished = s.projects.length - active.length;
  const dueSoon = active.filter((p) => { const d = daysLeft(p.due); return d !== null && d <= 7; });

  // オーナー確認事項（parse.js が作る。回答済み・反映待ちのものは answered に回答が入る）
  const allAsks = s.asks || [];
  const asks = allAsks.filter((a) => !a.answered);
  askMap = Object.fromEntries(allAsks.map((a) => [a.id, a]));

  $('k-active').innerHTML = `${active.length}<small>件</small>`;
  $('k-inbox').innerHTML = `${s.inbox.length}<small>件</small>`;
  $('k-due').innerHTML = `${dueSoon.length}<small>件</small>`;
  $('k-ask').innerHTML = `${asks.length}<small>件</small>`;
  $('kpi-due').classList.toggle('alert', dueSoon.some((p) => daysLeft(p.due) <= 3));
  $('kpi-ask').classList.toggle('alert', asks.length > 0);

  // クエスト一覧
  const quest = (p, i) => {
    const color = `var(${STAGE_COLOR[p.stage] || '--text'})`;
    return `<div class="quest ${i === 0 ? 'first' : ''}">
      <span class="cursor">▶</span>
      <div>
        <div class="q-name">${esc(p.name)}</div>
        <div class="q-meta">${[p.client, p.kind].filter(Boolean).map((x) => `<span>${esc(x)}</span>`).join('')}${p.amount ? `<span class="reward">${esc(p.amount)}</span>` : ''}${dueLabel(p.due)}</div>
      </div>
      <div class="bars">
        <span class="stage" style="color:${color}">【${esc(p.stage)}】</span> <span class="num">${p.progress}%</span>
        <div class="bar"><i style="width:${p.progress}%;background:${hpColor(p.progress)}"></i></div>
      </div>
      <div class="who"><span class="avatar">${face(p.owner)}</span>${esc(p.owner)}</div>
      ${p.next ? `<div class="q-next">${esc(p.next)}</div>` : ''}
    </div>`;
  };
  $('projects').innerHTML = active.length ? active.map(quest).join('')
    : `<div class="empty">進行中の案件はありません。<br>応募を決めた案件を GitHub の 05_projects/_inbox/ に入れると、オウセンたちが着手します。</div>`;
  if (finished) $('projects').innerHTML += `<div class="empty">完了・中止: ${finished}件</div>`;

  // パーティ
  $('team').innerHTML = s.team.map((m) => `<div class="member ${m.count ? 'busy' : ''}">
      <span class="avatar">${Sprites.svg(m.id, 40)}</span>
      <div style="min-width:0"><div class="n">${esc(m.id)}<span class="j">${esc(m.role)}</span></div>
        <div class="r">${m.count ? esc(m.projects.join('、')) : '—'}</div></div>
      <span class="st ${m.count ? 'busy' : 'free'}">${m.count ? `稼働中<br>${m.count}件` : '待機'}</span>
    </div>`).join('');

  // 冒険の記録（稼働状況）
  const hb = s.ops.heartbeat;
  const last = hb?.last_run || null;
  const lastAgo = last ? (Date.now() - new Date(last)) / 3600000 : Infinity;
  const jstHour = (new Date().getUTCHours() + 9) % 24;
  const inHours = jstHour >= 9 && jstHour <= 23;
  let st;
  if (!last) st = ['idle', 'まだ巡回の記録がありません'];
  else if (lastAgo <= 2.5) st = ['ok', 'オウセンは稼働中'];
  else if (!inHours && lastAgo <= 12) st = ['idle', '夜間は休止中（9時に再開）'];
  else st = ['warn', '巡回が止まっている可能性があります'];
  const rows = [
    ['最終巡回', last ? `${fmtTime(last)}（${ago(last)}）` : '—'],
    ['前回の結果', hb?.result ? esc(hb.result) : '—'],
    ['次回の巡回', s.ops.nextRun ? `${fmtTime(s.ops.nextRun)}（${until(s.ops.nextRun)}）` : '—'],
    ['最終更新', s.ops.lastCommit ? `${fmtTime(s.ops.lastCommit.at)}` : '—'],
    ['GitHub', s.sync.at ? (s.sync.ok ? `${ago(s.sync.at)} 同期済み` : `<span style="color:var(--low)">同期失敗</span>`) : '確認中…'],
  ];
  $('ops').innerHTML = `<div class="status ${st[0]}">${st[1]}</div>`
    + rows.map(([k, v]) => `<div class="row"><span>${k}</span><span>${v}</span></div>`).join('');

  // 報告
  // 回答を入力中は描き直さない（入力欄のフォーカスが外れるため）
  if (!document.activeElement?.classList.contains('ans-c')) $('asks').innerHTML = allAsks.length
    ? `<ul class="list">${allAsks.map((a) => `<li><span class="from">${esc(a.from)}</span>${esc(a.text)}
        ${a.answered
          ? `<div class="answered">回答済み（${esc(a.answered)}）・オウセンの反映待ち</div>`
          : `<div class="ans">
              <input class="ans-c" data-id="${a.id}" placeholder="ひとこと（任意）" value="${esc(drafts[a.id] || '')}">
              <button data-ans="OK" data-id="${a.id}">OK</button>
              <button data-ans="NG" data-id="${a.id}">NG</button>
            </div>`}
      </li>`).join('')}</ul>`
    : `<div class="empty">ありません</div>`;

  // 依頼
  $('inbox').innerHTML = s.inbox.length
    ? `<ul class="list">${s.inbox.map((i) => `<li><span class="from">${esc([i.source, i.kind, i.amount].filter(Boolean).join(' ・ ') || '着手待ち')}</span>${esc(i.name)}</li>`).join('')}</ul>`
    : `<div class="empty">空です</div>`;

  // メッセージ
  const msgs = [];
  if (s.sync.ok === false) msgs.push('オウセン「GitHubと同期できていません。\nネットの接続を確認してください。」');
  if (asks.length) msgs.push(`オウセン「オーナー、確認してほしいことが${asks.length}件あります。」`);
  const over = active.filter((p) => daysLeft(p.due) !== null && daysLeft(p.due) < 0);
  if (over.length) msgs.push(`オウセン「${over[0].name}の納期を過ぎています。\nすぐに対応します。」`);
  if (active.length) {
    msgs.push(`オウセン「いま${active.length}件の案件を進めています。\nいちばん急ぐのは ${active[0].name}です。」`);
    const busy = s.team.filter((m) => m.count && m.id !== 'オーナー');
    if (busy.length) msgs.push(`${busy.map((m) => m.id).join('、')}が作業中です。`);
  } else {
    msgs.push('オウセン「いまは進行中の案件がありません。\n次の案件を待っています。」');
  }
  if (s.inbox.length) msgs.push(`未着手の案件が${s.inbox.length}件あります。\n次の巡回で着手します。`);
  if (s.ops.nextRun) msgs.push(`次の巡回は${fmtTime(s.ops.nextRun)}です。（${until(s.ops.nextRun)}）`);
  msgs.push('オウセン「勝てる戦しかしない。」');
  const changed = JSON.stringify(msgs) !== JSON.stringify(msgQueue);
  msgQueue = msgs;
  if (changed) { msgIndex = 0; nextMessage(); }
}

// ---- データの読み込み ----
// PC（localhost）では server.js から、それ以外（スマホ）では GitHub から直接読む
const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};
const blobCache = new Map(); // sha → 中身（変わったファイルだけ取り直す）

function say(text) { msgQueue = [text]; msgIndex = 0; nextMessage(); }

async function gh(path, raw) {
  const r = await fetch('https://api.github.com' + path, {
    headers: {
      Authorization: 'Bearer ' + store.get('gh_token'),
      Accept: raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
    cache: 'no-store',
  });
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return raw ? r.text() : r.json();
}

async function stateFromGitHub() {
  const repo = store.get('gh_repo');
  const [commit] = await gh(`/repos/${repo}/commits?per_page=1`);
  const tree = await gh(`/repos/${repo}/git/trees/${commit.sha}?recursive=1`);
  const blobs = tree.tree.filter((t) => t.type === 'blob' && Parse.wanted(t.path));
  const keep = new Set(Parse.narrow(blobs.map((b) => b.path)));
  const files = {};
  await Promise.all(blobs.filter((b) => keep.has(b.path)).map(async (b) => {
    if (!blobCache.has(b.sha)) blobCache.set(b.sha, await gh(`/repos/${repo}/git/blobs/${b.sha}`, true));
    files[b.path] = blobCache.get(b.sha);
  }));
  const c = commit.commit;
  return Parse.buildState(files, {
    lastCommit: { at: c.committer.date, message: c.message.split('\n')[0], author: c.author.name },
    sync: { at: new Date().toISOString(), ok: true, message: '' },
  });
}

function showSetup(error) {
  const guess = /\.github\.io$/.test(location.hostname) ? location.hostname.split('.')[0] + '/ai-company' : '';
  $('f-repo').value = store.get('gh_repo') || guess;
  $('f-token').value = '';
  $('f-err').textContent = error || '';
  $('setup').classList.add('show');
}

let loading = false;
async function load() {
  if (loading) return;
  loading = true;
  try {
    if (LOCAL) {
      const r = await fetch('/api/state', { cache: 'no-store' });
      render(await r.json());
    } else if (!store.get('gh_token') || !store.get('gh_repo')) {
      showSetup();
    } else {
      render(await stateFromGitHub());
    }
  } catch (e) {
    if (LOCAL) say('サーバーに接続できません。\nデスクトップのアイコンから起動し直してください。');
    else if (e.status === 401) showSetup('トークンが無効か、期限切れです。新しいトークンを入力してください。');
    else if (e.status === 403 || e.status === 404) showSetup('リポジトリが見つからないか、トークンに読み取り権限がありません。');
    else say('GitHub に接続できません。\n電波の良いところで「最新を取得」を押してください。');
  } finally {
    loading = false;
  }
}

// ---- オーナー確認事項への回答 ----
let askMap = {};
const drafts = {}; // 入力中のひとこと（再描画で消えないように覚えておく）

function utf8Base64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
}

async function saveAnswer(ask, answer, comment) {
  const at = new Date().toISOString();
  if (LOCAL) {
    const r = await fetch('/api/answer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ask, answer, comment, at }),
    });
    if (!r.ok) throw new Error(await r.text());
    return;
  }
  const repo = store.get('gh_repo');
  const path = Parse.answerPath(ask, at);
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    method: 'PUT',
    headers: {
      Authorization: 'Bearer ' + store.get('gh_token'),
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
    },
    body: JSON.stringify({ message: `オーナーの回答: ${answer}（${ask.from}）`, content: utf8Base64(Parse.answerFile(ask, answer, comment, at)) }),
  });
  if (r.status === 403 || r.status === 404) {
    const e = new Error('トークンに書き込みの権限がありません。Contents を「Read and write」にしたトークンを作り直し、⚙ から入れ直してください。');
    e.permission = true;
    throw e;
  }
  if (!r.ok) throw new Error('GitHub に保存できませんでした（' + r.status + '）');
}

$('asks').addEventListener('input', (ev) => {
  if (ev.target.classList.contains('ans-c')) drafts[ev.target.dataset.id] = ev.target.value;
});
$('asks').addEventListener('click', async (ev) => {
  const btn = ev.target.closest('button[data-ans]');
  if (!btn) return;
  const ask = askMap[btn.dataset.id];
  if (!ask) return;
  const answer = btn.dataset.ans;
  const comment = drafts[ask.id] || '';
  if (answer === 'NG' && !comment.trim()) {
    say('NGのときは、理由やどうしてほしいかを\nひとこと書いてから押してください。');
    return;
  }
  btn.closest('.ans').querySelectorAll('button,input').forEach((el) => { el.disabled = true; });
  try {
    await saveAnswer(ask, answer, comment);
    delete drafts[ask.id];
    say(`オウセン「回答を受け取りました（${answer}）。\nすぐに反映します。」`);
    setTimeout(load, 1500);
  } catch (e) {
    say(e.message);
    btn.closest('.ans').querySelectorAll('button,input').forEach((el) => { el.disabled = false; });
  }
});

$('setup-form').onsubmit = (ev) => {
  ev.preventDefault();
  const repo = $('f-repo').value.trim().replace(/^https:\/\/github\.com\//, '').replace(/\/$/, '');
  const token = $('f-token').value.trim();
  if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { $('f-err').textContent = 'リポジトリは「ユーザー名/リポジトリ名」の形で入力してください。'; return; }
  if (!token) { $('f-err').textContent = 'トークンを入力してください。'; return; }
  store.set('gh_repo', repo);
  store.set('gh_token', token);
  blobCache.clear();
  $('setup').classList.remove('show');
  say('読み込み中…');
  load();
};
$('f-forget').onclick = () => { store.del('gh_token'); store.del('gh_repo'); showSetup('設定を消しました。'); };
$('settings').onclick = () => showSetup();
if (!LOCAL) document.body.classList.add('gh');

$('refresh').onclick = async () => {
  $('refresh').disabled = true;
  if (LOCAL) {
    await fetch('/api/pull', { method: 'POST' }).catch(() => {});
    setTimeout(() => { load(); $('refresh').disabled = false; }, 4000);
  } else {
    await load();
    $('refresh').disabled = false;
  }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
setInterval(load, LOCAL ? 30000 : 120000);
if (!LOCAL && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
